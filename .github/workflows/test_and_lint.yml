name: Lint Test and Build

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  
env:
  NODE_VERSION: 22.x

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Setup Node já com cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 2. Instalação limpa
      - name: Install dependencies
        run: npm ci

      # 3. Qualidade de código
      - name: Run linter
        run: npm run lint

      # 4. Testes (Futuro)
      # - name: Run tests
      #   run: npm run test:ci

      # 5. Build final
      - name: Build
        run: npm run build